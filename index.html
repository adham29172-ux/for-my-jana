  <script>

// دوسة بسيطة وناعمة عند الضغط على أي زرار
let audioCtx = null;
let noiseBuffer = null;

function playTap() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();

    const t = audioCtx.currentTime;

    // نقرة قصيرة جدًا من ضوضاء مفلترة
    if (!noiseBuffer) {
      const len = Math.floor(audioCtx.sampleRate * 0.05);
      noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    }
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(1400, t);

    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.07, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);

    src.connect(filter);
    filter.connect(g);
    g.connect(audioCtx.destination);
    src.start(t);
    src.stop(t + 0.05);

    // "طَب" خفيفة ووطية تدي إحساس الضغطة
    const osc = audioCtx.createOscillator();
    const og = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(180, t);
    osc.frequency.exponentialRampToValueAtTime(90, t + 0.06);
    og.gain.setValueAtTime(0.0001, t);
    og.gain.linearRampToValueAtTime(0.06, t + 0.004);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    osc.connect(og);
    og.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.08);
  } catch (e) {}
}

document.addEventListener("click", (e) => {
  if (e.target.closest("button")) playTap();
});

const app = document.getElementById("app");

const mainMessage = `في حاجات كتير ممكن الواحد يعدّي عليها في يومه وينساها، بس في أشخاص بيكون ليهم طريقة غريبة في إنهم يفضلوا في باله حتى من غير ما يعملوا حاجة. وإنتِ من الناس دي بالنسبالي. بحب تفاصيلك اللي يمكن إنتِ نفسك مش واخدة بالك منها، وطريقتك في الكلام، وردود فعلك، وحتى الحاجات الصغيرة اللي بتحكيهالي. مش لازم كل يوم يكون فيه كلام كبير أو لحظات مميزة، ساعات مجرد كلام عادي معاكي بيكون كفاية إنه يخلّي يومي أحسن. وكل اللي عايز أقوله إن وجودك فارق معايا، وإنك مش شخص عادي بالنسبالي.`;

const letters = [
  {
    title: "A Little Wish",
    icon: "🌷",
    caption: "A wish for you",
    heading: "أمنية صغيرة ليكي ♡",
    text: `عارف إن عيد ميلادك مش هيغيّر كل حاجة فجأة، وإن بعده هترجعي لنفس يومك العادي، نفس الحاجات اللي وراكي ونفس التفاصيل الصغيرة. بس بجد أتمنى السنة دي تكون أحنّ عليكي، تلاقي فيها حاجات كنتِ مستنياها تحصل، وتوصلي لحاجات تعبتي عشانها. أتمنى تضحكي كتير، ومتضطريش تكدّري نفسك عشان حاجات متستاهلش، وكل مرة تحسي إن الدنيا مش ماشية زي ما إنتِ عايزة تلاقي حاجة حلوة تعوّضك. تستاهلي سنة حلوة يا جنى.`
  },
  {
    title: "Something I Never Said",
    icon: "💌",
    caption: "A little confession",
    heading: "حاجة مقلتهالكش ♡",
    text: `في تفاصيل صغيرة فيكي أنا فعلًا باخد بالي منها. زي لما تحكيلي عن حاجة حصلت في يومك وتدخلي في تفاصيلها، أو لما تردّي بطريقة تضحكني من غير ما تكوني قاصدة، أو لما نفتح موضوع عادي جدًا ونفضل نتكلم فيه. الحاجات دي يمكن بالنسبالك مواقف عادية وبتعدّي، بس أنا ببقى مبسوط بيها. ومش بقولك الكلام ده عشان تستني مني رد فعل معين، أنا بس حبيت تعرفي إن التفاصيل اللي ممكن متاخديش بالك منها ليها قيمة عندي.`
  },
  {
    title: "One More Surprise",
    icon: "🦋",
    caption: "The last little note",
    heading: "مفاجأة أخيرة ♡",
    text: `عارفة إيه أكتر حاجة حبيتها في فكرة الموقع ده؟ إني قعدت أفكر في كل تفصيلة فيه، من الألوان للصور للرسائل، وأفضل أغيّر وأظبط لحد ما أحس إنه بقى شبه الحاجة اللي كنت عايز أعملهالك. يمكن لما تفتحيه هتشوفيه مجرد موقع صغير فيه شوية كلام وورد، بس وراه وقت وتفكير، وكل تفصيلة فيه اتحطت عشان تبقى ليكي إنتِ. ويارب لما تخلصي جولتك الصغيرة هنا تكوني ابتسمتي ولو مرة واحدة. عيد ميلاد سعيد يا جنى. ♡`
  }
];

const openedLetters = new Set();

// الرسالة الأساسية
function showLetter() {
  app.innerHTML = `
    <section class="page-section">
      <h2 class="section-title">A Letter For Jana ♡</h2>
      <p class="section-subtitle">A LITTLE NOTE FROM ME</p>

      <div class="letter-card">
        <h3 class="letter-heading">عارفة يا جنى،</h3>
        <p class="letter-text" id="typedMessage"></p>
        <div class="letter-footer">♡ ✦ ♡</div>
      </div>

      <button class="action-button" id="gardenBtn">
        Enter the garden ♡
      </button>
    </section>
  `;

  const output = document.getElementById("typedMessage");
  const chars = Array.from(mainMessage);
  let index = 0;

  const typing = setInterval(() => {
    if (!output.isConnected) {
      clearInterval(typing);
      return;
    }

    output.textContent += chars[index];
    index++;

    if (index >= chars.length) {
      clearInterval(typing);
    }
  }, 12);

  document.getElementById("gardenBtn").addEventListener("click", showGarden);
}

// حديقة الأظرف
function showGarden() {
  app.innerHTML = `
    <section class="page-section garden-section">
      <div class="garden-decor">🌷 🦋 🌸</div>

      <h2 class="section-title">Jana's Little Garden</h2>

      <p class="garden-intro">
        زرعتلك هنا شوية كلام صغير...
        افتحي كل ظرف واكتشفي اللي جواه ♡
      </p>

      <div class="envelope-grid">
        ${letters.map((letter, index) => `
          <button
            class="envelope ${openedLetters.has(index) ? "opened" : ""}"
            data-letter="${index}"
          >
            <span class="envelope-icon">
              ${openedLetters.has(index) ? "💗" : "✉️"}
            </span>

            <span class="envelope-title">
              ${letter.title}
            </span>

            <span class="envelope-caption">
              ${openedLetters.has(index) ? "Opened ♡" : letter.caption}
            </span>
          </button>
        `).join("")}
      </div>

      <div class="garden-bottom">🌼 🌷 🌼</div>

      <p class="garden-progress">
        ${openedLetters.size} / 3 letters opened
      </p>

      ${
        openedLetters.size === 3
          ? `<p class="final-garden-message">
               فتحتي كل الأظرف... بس لسه في آخر حاجة ليكي ♡
             </p>
             <button class="action-button" id="storyBtn">
               Our Story ✦
             </button>`
          : ""
      }
    </section>
  `;

  document.querySelectorAll("[data-letter]").forEach(button => {
    button.addEventListener("click", () => {
      openLetter(Number(button.dataset.letter));
    });
  });

  const storyBtn = document.getElementById("storyBtn");

  if (storyBtn) {
    storyBtn.addEventListener("click", showStory);

}

function showStory() {

    <section class="page-section">

// الكيكة والأمنية
const WISH_PHONE = ""; // رقم الواتساب بصيغة دولية بدون + (مثال: 201012345678)

function showCake() {
  app.innerHTML = `
    <section class="page-section cake-section">
      <h2 class="section-title">Happy Birthday ♡</h2>
      <p class="section-subtitle" id="cakeHint">TAP THE CANDLE TO BLOW IT OUT</p>

      <button class="cake-btn" id="candleBtn" aria-label="candle">
        <svg viewBox="0 0 220 250" width="230" id="cakeSvg" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="110" cy="228" rx="95" ry="12" fill="#00000055"/>
          <rect x="30" y="150" width="160" height="70" rx="14" fill="#6d1230"/>
          <path d="M30 164 q10 18 20 0 q10 18 20 0 q10 18 20 0 q10 18 20 0 q10 18 20 0 q10 18 20 0 q10 18 20 0 q10 18 20 0 L190 150 L30 150 Z" fill="#e3c08d"/>
          <rect x="55" y="105" width="110" height="52" rx="12" fill="#9b2243"/>
          <path d="M55 118 q9 14 18 0 q9 14 18 0 q9 14 18 0 q9 14 18 0 q9 14 18 0 q9 14 18 0 L165 105 L55 105 Z" fill="#f5e4da"/>
          <circle cx="75" cy="185" r="5" fill="#e3c08d"/>
          <circle cx="110" cy="190" r="5" fill="#e3c08d"/>
          <circle cx="145" cy="185" r="5" fill="#e3c08d"/>
          <rect x="104" y="62" width="12" height="46" rx="4" fill="#f5e4da"/>
          <path d="M104 74 l12 6 M104 88 l12 6" stroke="#e3c08d" stroke-width="3"/>
          <g class="flame">
            <ellipse cx="110" cy="46" rx="9" ry="16" fill="#e3c08d"/>
            <ellipse cx="110" cy="50" rx="4.5" ry="8" fill="#fff4d6"/>
          </g>
          <g class="smoke">
            <path d="M110 58 q-8 -14 0 -26 q8 -12 0 -26" stroke="#f5e4da" stroke-width="3" fill="none" stroke-linecap="round"/>
          </g>
        </svg>
      </button>

      <div id="wishArea"></div>
    </section>
  `;

  document.getElementById("candleBtn").addEventListener("click", blowCandle, { once: true });
}

function blowCandle() {
  document.getElementById("cakeSvg").classList.add("out");
  document.getElementById("cakeHint").textContent = "NOW MAKE A WISH ♡";

  document.getElementById("wishArea").innerHTML = `
    <p class="wish-prompt">اتمني أمنية في سرك... وبعدين اكتبيها لو حابة ♡</p>
    <textarea id="wishInput" class="wish-input" rows="3" placeholder="أمنيتي..."></textarea>
    <button class="action-button" id="wishBtn">Make my wish ✦</button>
  `;

  document.getElementById("wishBtn").addEventListener("click", makeWish);
}

function makeWish() {
  const wish = document.getElementById("wishInput").value.trim();
  const area = document.getElementById("wishArea");

  const sendBtn = (wish && WISH_PHONE)
    ? `<p class="wish-note">لو حابة أعرف أمنيتك، دوسي هنا وهتتبعت على واتساب. وإنتِ اللي بتدوسي إرسال ♡</p>
       <a class="listen-link" target="_blank" rel="noopener"
          href="https://wa.me/${WISH_PHONE}?text=${encodeURIComponent("أمنيتي: " + wish)}">
         ابعتي أمنيتي ♡
       </a>`
    : "";

  area.innerHTML = `
    <div class="wish-card">
      <div class="sparkle">✦</div>
      <p class="wish-title">${wish ? "أمنيتك:" : "أمنيتك في قلبك ♡"}</p>
      ${wish ? `<p class="wish-text" id="wishText"></p>` : ""}
    </div>
    ${sendBtn}
    <button class="action-button" id="finishBtn">One Last Thing ♡</button>
  `;

  if (wish) document.getElementById("wishText").textContent = wish;
  document.getElementById("finishBtn").addEventListener("click", showFinal);
}

// فتح ظرف
function openLetter(index) {
  openedLetters.add(index);

  const letter = letters[index];

  app.innerHTML = `

        <h2 class="section-title">${letter.title}</h2>

function showFinal() {
  app.innerHTML = `

      <h2 class="final-title">Happy Birthday, Jana ♡</h2>

      <p class="final-message">
        أتمنى يومك يكون جميل شبهك،
        وسنتك الجديدة تكون مليانة حاجات حلوة
        وضحك ونجاحات ولحظات تفضلي فاكرها.
        <br><br>
        You deserve all the beautiful things. ♡
      </p>

      <div class="letter-footer">25 November ♡</div>
    </section>
  `;

  startHearts();
}

// قلوب متحركة
function startHearts() {
  const heartInterval = setInterval(() => {
    if (!document.querySelector(".final-section")) {
      clearInterval(heartInterval);
      return;
    }

    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = ["♡", "♥", "✦"][Math.floor(Math.random() * 3)];

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 20) + "px";
    heart.style.animationDuration = (4 + Math.random() * 3) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 7000);
  }, 450);
}

// زر البداية الأصلي
document.getElementById("openBtn").addEventListener("click", showLetter);
